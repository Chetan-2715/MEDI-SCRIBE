<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Signing in...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: #0d9488;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h2 {
            color: #1e293b;
            margin-bottom: 8px;
            font-size: 20px;
        }

        p {
            color: #64748b;
            font-size: 14px;
        }

        .error {
            color: #dc2626;
            margin-top: 12px;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="spinner" id="spinner"></div>
        <h2 id="title">Signing you in...</h2>
        <p id="subtitle">Please wait while we complete your Google login.</p>
        <p class="error" id="error" style="display:none;"></p>
    </div>

    <script>
        (async function () {
            const API_URL = 'http://localhost:8000';

            try {
                // Extract id_token from the URL hash fragment
                const hash = window.location.hash.substring(1);
                if (!hash) {
                    showError('No authentication data received from Google.');
                    return;
                }

                const params = new URLSearchParams(hash);
                const idToken = params.get('id_token');

                if (!idToken) {
                    showError('No token received from Google. Please try again.');
                    return;
                }

                // Send the token to our backend
                document.getElementById('subtitle').textContent = 'Verifying your account...';

                const response = await fetch(API_URL + '/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: idToken })
                });

                if (!response.ok) {
                    const err = await response.json().catch(() => ({ detail: 'Login failed' }));
                    showError(err.detail || 'Google login failed. Please try again.');
                    return;
                }

                const data = await response.json();

                // Store auth data in localStorage (matching AuthContext keys)
                localStorage.setItem('auth_token', data.access_token);
                localStorage.setItem('auth_user', JSON.stringify(data.user));

                // Show success and redirect
                document.getElementById('title').textContent = 'Welcome!';
                document.getElementById('subtitle').textContent = 'Redirecting to your dashboard...';

                // Redirect to the app dashboard
                setTimeout(() => {
                    window.location.href = '/#/dashboard';
                }, 500);

            } catch (e) {
                showError('Something went wrong: ' + e.message);
            }

            function showError(msg) {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('title').textContent = 'Login Failed';
                document.getElementById('subtitle').style.display = 'none';
                const errorEl = document.getElementById('error');
                errorEl.textContent = msg;
                errorEl.style.display = 'block';

                // Add a retry link
                const link = document.createElement('a');
                link.href = '/#/login';
                link.textContent = '← Back to Login';
                link.style.cssText = 'display:block;margin-top:16px;color:#0d9488;text-decoration:none;font-weight:600;';
                errorEl.parentElement.appendChild(link);
            }
        })();
    </script>
</body>

</html>
